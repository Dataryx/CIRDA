name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build Python packages
        run: |
          uv sync --all-packages
          uv build --package cirda-core
          uv build --package cirda-bench
          uv build --package cirda-api
          uv build --package cirda-ingest

      - name: Build frontend
        run: |
          cd apps/web && pnpm install --frozen-lockfile && pnpm build

      - name: Generate OpenAPI
        run: uv run python scripts/generate_openapi.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            packages/contracts/openapi/cirda-v1.yaml
            packages/contracts/openapi/cirda-v1.json
