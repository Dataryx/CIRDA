[project]
name = "cirda-bench"
version = "1.0.0"
description = "CIRDA benchmark harness for dependency analysis evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cirda-core",
    "networkx>=3.3",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
cirda-bench = "cirda_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirda_bench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../cirda-core/src"]

[tool.uv.sources]
cirda-core = { workspace = true }
