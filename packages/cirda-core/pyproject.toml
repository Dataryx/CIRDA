[project]
name = "cirda-core"
version = "1.0.0"
description = "CIRDA pure Python domain library for dependency analysis and safety gating"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirda_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cirda_core"]
