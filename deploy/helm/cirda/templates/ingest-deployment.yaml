apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cirda.fullname" . }}-ingest
  labels:
    {{- include "cirda.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      {{- include "cirda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingest
  template:
    metadata:
      labels:
        {{- include "cirda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingest
    spec:
      containers:
        - name: ingest
          image: "{{ .Values.global.imageRegistry }}{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
            - name: otlp
              containerPort: 4318
          envFrom:
            - configMapRef:
                name: {{ include "cirda.fullname" . }}-config
            - secretRef:
                name: {{ include "cirda.fullname" . }}-secret
          env:
            - name: CIRDA_EVENT_BUS
              value: kafka
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
