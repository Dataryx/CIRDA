{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cirda.fullname" . }}-default
  labels:
    {{- include "cirda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cirda.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 80
    - from:
        - podSelector:
            matchLabels:
              {{- include "cirda.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
{{- end }}
