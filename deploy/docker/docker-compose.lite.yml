# CIRDA lite stack — no Kafka/Redpanda, in-memory event bus, SQLite
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      bash -c "pip install uv && uv sync --all-packages &&
      cd apps/api && uv run uvicorn cirda_api.asgi:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../..:/workspace
    environment:
      CIRDA_APP_ENV: development
      CIRDA_MEMORY_STORE: "true"
      CIRDA_EVENT_BUS: inmemory
      CIRDA_AUTH_MODE: dev
      CIRDA_SCHEDULER_ENABLED: "false"
      CIRDA_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    command: sh -c "corepack enable && corepack prepare pnpm@9.12.3 --activate && pnpm install && pnpm dev --host 0.0.0.0"
    volumes:
      - ../../apps/web:/workspace/apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
