# CIRDA lite stack — Postgres + Redis + API + Web (no Kafka/Redpanda/OTel)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cirda
      POSTGRES_PASSWORD: cirda
      POSTGRES_DB: cirda
    ports:
      - "5432:5432"
    volumes:
      - pgdata_lite:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cirda -d cirda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      CIRDA_APP_ENV: development
      CIRDA_ENV: local
      CIRDA_MEMORY_STORE: "false"
      CIRDA_DATABASE_URL: postgresql+asyncpg://cirda:cirda@postgres:5432/cirda
      CIRDA_REDIS_URL: redis://redis:6379/0
      CIRDA_EVENT_BUS: inmemory
      CIRDA_AUTH_MODE: dev
      CIRDA_SCHEDULER_ENABLED: "false"
      CIRDA_OTEL_ENABLED: "false"
      CIRDA_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://web
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata_lite:
