# CIRDA full stack — Postgres, Redis, Redpanda, OTel, API, ingest, web
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cirda
      POSTGRES_PASSWORD: cirda
      POSTGRES_DB: cirda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cirda -d cirda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      CIRDA_APP_ENV: development
      CIRDA_ENV: local
      CIRDA_MEMORY_STORE: "false"
      CIRDA_DATABASE_URL: postgresql+asyncpg://cirda:cirda@postgres:5432/cirda
      CIRDA_REDIS_URL: redis://redis:6379/0
      CIRDA_EVENT_BUS: redis
      CIRDA_AUTH_MODE: dev
      CIRDA_OTEL_ENABLED: "true"
      CIRDA_OTEL_ENDPOINT: http://otel-collector:4317
      CIRDA_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://web
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  ingest-worker:
    build:
      context: ../..
      dockerfile: apps/ingest-worker/Dockerfile
    environment:
      CIRDA_APP_ENV: development
      CIRDA_ENV: local
      CIRDA_MEMORY_STORE: "false"
      CIRDA_EVENT_BUS: kafka
      CIRDA_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CIRDA_KAFKA_GROUP_ID: cirda-ingest
      CIRDA_DATABASE_URL: postgresql+asyncpg://cirda:cirda@postgres:5432/cirda
      CIRDA_REDIS_URL: redis://redis:6379/1
      CIRDA_OTLP_LISTEN_PORT: "4318"
    ports:
      - "8081:8081"
      - "4319:4318"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')\"",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
